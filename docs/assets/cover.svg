<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Minut integration for Gladys Assistant. The Minut wordmark
       is the official logo of Minut (logo-full.svg of minut.com), a trademark
       of its owner, shown to name the service the integration connects to;
       the sensor on the wall is an illustration, not a picture of the product.
       Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3445"/>
      <stop offset="1" stop-color="#2d4a5f"/>
    </linearGradient>
    <radialGradient id="puck" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dee5"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#wall)"/>

  <!-- the sensor on the wall, and the sound it hears -->
  <g transform="translate(590 250)">
    <g fill="none" stroke="#8fd1b0" stroke-linecap="round">
      <path d="M-150 -70 A170 170 0 0 0 -150 70" stroke-width="7" opacity="0.35"/>
      <path d="M-128 -48 A130 130 0 0 0 -128 48" stroke-width="7" opacity="0.6"/>
      <path d="M150 -70 A170 170 0 0 1 150 70" stroke-width="7" opacity="0.35"/>
      <path d="M128 -48 A130 130 0 0 1 128 48" stroke-width="7" opacity="0.6"/>
    </g>
    <circle r="102" fill="#000000" opacity="0.18" transform="translate(6 10)"/>
    <circle r="100" fill="url(#puck)"/>
    <circle r="78" fill="none" stroke="#c4ced8" stroke-width="2"/>
    <circle cy="44" r="5" fill="#5cc28d"/>
    <text y="-4" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1f3445">42</text>
    <text y="22" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#4d5b69">dBA</text>
  </g>

  <!-- the Minut wordmark, the title, the values -->
  <g transform="translate(50 52) scale(3.9)" fill="#ffffff">
    <path d="M13.2 5.663h-1.423a.773.773 0 00-.619.23c-.133.155-.225.265-.283.336l-3.992 6.927L2.9 6.229c-.057-.071-.15-.181-.283-.336a.773.773 0 00-.619-.23H.566a.545.545 0 00-.4.168.545.545 0 00-.168.4v13.556a.545.545 0 00.168.4.545.545 0 00.4.168h1.7a.574.574 0 00.566-.566v-8.2L5.56 16.31a1.807 1.807 0 00.292.345.669.669 0 00.482.177h1.093a.688.688 0 00.482-.177 1.78 1.78 0 00.292-.345l2.728-4.721v8.2a.574.574 0 00.566.566h1.7a.574.574 0 00.566-.566V6.229a.545.545 0 00-.168-.4.5.5 0 00-.389-.168M20.234 5.663h-1.7a.574.574 0 00-.566.566v13.563a.574.574 0 00.566.566h1.7a.574.574 0 00.566-.566V6.229a.574.574 0 00-.566-.566M35.998 5.663h-1.7a.574.574 0 00-.566.566v8.647l-5.883-8.731a3.418 3.418 0 00-.274-.292.746.746 0 00-.544-.19h-1.466a.574.574 0 00-.566.566v13.563a.574.574 0 00.566.566h1.7a.574.574 0 00.566-.566V11.14l5.88 8.731a3.417 3.417 0 00.274.292.728.728 0 00.544.19h1.468a.574.574 0 00.566-.566V6.229a.574.574 0 00-.566-.566M51.722 5.663h-1.68a.574.574 0 00-.566.566v8.5a3.908 3.908 0 01-.243 1.468 2.639 2.639 0 01-.663 1 2.517 2.517 0 01-1.017.566 4.488 4.488 0 01-1.291.177 4.561 4.561 0 01-1.282-.177 2.456 2.456 0 01-1.658-1.565 4.143 4.143 0 01-.23-1.468v-8.5a.574.574 0 00-.566-.566h-1.7a.574.574 0 00-.566.566v8.607a7.135 7.135 0 00.367 2.352 4.7 4.7 0 001.123 1.8 5.1 5.1 0 001.879 1.167 8.62 8.62 0 005.261 0 5.061 5.061 0 001.888-1.167 4.774 4.774 0 001.132-1.8 6.89 6.89 0 00.376-2.352V6.229a.545.545 0 00-.168-.4.512.512 0 00-.393-.168M66.142 5.831a.559.559 0 00-.4-.168H55.356a.574.574 0 00-.566.566v1.49a.574.574 0 00.566.566h3.78v11.5a.574.574 0 00.566.566h1.7a.574.574 0 00.566-.566v-11.5h3.78a.574.574 0 00.566-.566v-1.49a.567.567 0 00-.172-.4M20.096.42l-.221-.221a.7.7 0 00-.632-.186l-.044.014c-.027.009-.057.013-.084.022a.647.647 0 00-.23.15l-.221.221-1.547 1.548a.7.7 0 000 .99l.225.221a.7.7 0 00.99 0l1.052-1.052 1.052 1.052a.7.7 0 00.99 0l.221-.221a.7.7 0 000-.99z"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="52" y="172" font-size="26" fill="#dbe7f5">for Gladys Assistant</text>
    <text x="52" y="210" font-size="19" fill="#c3d4ea">noise · alarm · indoor climate</text>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#ffffff">
    <g transform="translate(52 262)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">Noise</text><text x="282" y="31" text-anchor="end" fill="#7ad08f">Quiet</text>
    </g>
    <g transform="translate(52 318)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">Alarm</text><text x="282" y="31" text-anchor="end" fill="#8cc4ff">On</text>
    </g>
    <g transform="translate(52 374)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">Temperature</text><text x="282" y="31" text-anchor="end">21.5 °C</text>
    </g>
    <g transform="translate(52 430)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">Humidity</text><text x="282" y="31" text-anchor="end">48 %</text>
    </g>
  </g>
</svg>
